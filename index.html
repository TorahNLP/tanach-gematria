<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tanach Gematria</title>
<link rel="manifest" href="./manifest.json"/>
<link rel="icon" href="./icon-192.png"/>
<meta name="theme-color" content="#312e81"/>
<link rel="apple-touch-icon" href="./icon-180.png"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Gematria"/>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #0e1117;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  /* The app iframe fills the screen and starts loading immediately, but sits
     UNDER the opaque overlay until the app itself says it's ready. */
  #app-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    z-index: 1;
  }
  /* Full-screen opaque overlay — hides the app's cold-start loading behind a
     friendly screen until the app posts 'gem-app-ready'. */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #0e1117;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    padding: 2rem;
    text-align: center;
  }
  #loader .inner { max-width: 380px; display: flex; flex-direction: column;
    align-items: center; gap: 1.1rem; }
  .gem-letter {
    font-family: 'Noto Serif Hebrew', David, 'Times New Roman', serif;
    font-size: 2.6rem;
    font-weight: 700;
    color: #A5B4FC;
    line-height: 1;
    min-height: 1.2em;
  }
  #status {
    font-size: 0.95rem;
    color: #cbd5e1;
    min-height: 1.4em;
  }
  #retry-btn {
    margin-top: 0.4rem;
    padding: 0.55rem 1.2rem;
    border-radius: 8px;
    border: 1px solid #4F46E5;
    background: transparent;
    color: #A5B4FC;
    font-size: 0.9rem;
    cursor: pointer;
    display: none;
  }
  #retry-btn:active { background: rgba(79,70,229,0.2); }
  #reload-corner {
    /* Top-left, not top-right: Streamlit renders its own "…" menu top-right,
       which this would otherwise overlap once the app is revealed. */
    position: fixed;
    top: max(0.5rem, env(safe-area-inset-top));
    left: max(0.6rem, env(safe-area-inset-left));
    font-size: 0.75rem;
    color: #6b7280;
    text-decoration: none;
    z-index: 20;
    padding: 0.3rem 0.5rem;
    background: rgba(14,17,23,0.55);
    border-radius: 6px;
  }
</style>
</head>
<body>

<a id="reload-corner" href="./" title="Reload">&#8635; Reload</a>

<!-- The app loads immediately and warms up behind the overlay. -->
<iframe id="app-frame" title="Tanach Gematria" allow="clipboard-write; fullscreen"></iframe>

<div id="loader">
  <div class="inner">
    <div class="gem-letter" id="gem-letter" aria-hidden="true">א</div>
    <div id="status" role="status" aria-live="polite">Warming up the search engine&hellip;</div>
    <div style="font-size:0.8rem;color:#6b7280;">
      Free hosting can take up to a minute to wake up &mdash; this screen lifts
      automatically the moment the app is ready.
    </div>
    <button id="retry-btn">Open now</button>
  </div>
</div>

<script>
(function () {
  // The "/~/+/" prefix is Streamlit Community Cloud's own internal path to the
  // app's real content, bypassing its outer "Fork"/GitHub toolbar. Change only
  // if the app moves to a different host.
  var APP_URL = "https://tanach-gematria.streamlit.app/~/+/?view=app";

  var letterEl = document.getElementById("gem-letter");
  var statusEl = document.getElementById("status");
  var retryBtn = document.getElementById("retry-btn");
  var frame = document.getElementById("app-frame");
  var loader = document.getElementById("loader");

  // Cosmetic — mirrors the app's own status-widget letters so the hand-off
  // from overlay to app feels like one continuous screen.
  var LETTERS = "אבגדהוזחטיכךלמםנןסעפףצץקרשת".split("");
  var recent = [];
  function pickLetter() {
    for (var t = 0; t < 40; t++) {
      var c = LETTERS[Math.floor(Math.random() * LETTERS.length)];
      if (recent.indexOf(c) === -1) {
        recent.push(c);
        if (recent.length > 4) recent.shift();
        return c;
      }
    }
    return LETTERS[0];
  }
  var letterTimer = setInterval(function () {
    letterEl.textContent = pickLetter();
  }, 220);

  var opened = false;
  function revealApp() {
    if (opened) return;
    opened = true;
    clearInterval(letterTimer);
    loader.style.display = "none";   // the iframe underneath is already loaded
  }

  // The real readiness signal: the app posts 'gem-app-ready' from inside itself
  // the moment its search UI actually renders (corpus loaded, interactive). We
  // cannot detect that from out here — the app is a cross-origin iframe, its
  // server answers _stcore/health within a second (long before the app is
  // usable), and the iframe 'load' event fires on the bare shell just as early.
  // So we wait for the app's own word. See _signal_app_ready() in app.py.
  window.addEventListener("message", function (e) {
    if (e && e.data === "gem-app-ready") revealApp();
  });

  // Start the app loading right away, underneath the overlay.
  frame.src = APP_URL;

  // Escape hatches so the overlay can never trap anyone: a manual button after
  // a short wait (also lets a Community-Cloud "wake this app?" screen through),
  // and a hard fallback that lifts the overlay regardless.
  setTimeout(function () {
    if (!opened) {
      statusEl.textContent = "Taking longer than usual — you can open it now, or keep waiting.";
      retryBtn.style.display = "inline-block";
    }
  }, 12000);
  setTimeout(revealApp, 50000);

  retryBtn.addEventListener("click", revealApp);
})();
</script>
</body>
</html>
